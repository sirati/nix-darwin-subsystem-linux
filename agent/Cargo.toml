[package]
name = "linux-vm-agent"
version = "0.1.0"
edition = "2021"
description = "Integration agent between a macOS host and a libkrun NixOS guest"
publish = false

[[bin]]
name = "linux-vm-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
